<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1210">
<meta name="description" content="EasyZFS — Gestión ZFS ligera para servidores caseros">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>EasyZFS - Gestión ZFS</title>
<script>
// Apariencia inicial antes del primer paint (evita parpadeo):
// tema (auto = prefers-color-scheme del SO), acento, densidad y
// reduce-motion guardados. Claves canónicas easyzfs-* con migración
// desde las legacy zfc-* (pre-rebrand zfsctl).
(function(){try{
  var ls=localStorage;
  function getk(nuevo,legacy){
    var v=ls.getItem(nuevo);
    if(v!==null)return v;
    var o=ls.getItem(legacy);
    if(o!==null){ls.setItem(nuevo,o);ls.removeItem(legacy);}
    return o;
  }
  var t=getk('easyzfs-theme-mode','zfc-theme');
  var dark=t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(dark)document.documentElement.dataset.theme='dark';
  // ESPEJO de ACCENTS en ui/theme.ts: si cambia una, cambia la otra.
  var ACC={
    cyan:{l:['#0e7c93','#dff0f4'],d:['#4cc3d9','#13292f']},
    steel:{l:['#3a6ea5','#e2ebf4'],d:['#7ba7d9','#1b2634']},
    emerald:{l:['#2f7d5f','#e3f0e9'],d:['#5cb893','#1d2f27']},
    amber:{l:['#a8741f','#f6ecd9'],d:['#d9a84e','#33291a']}
  };
  var a=ACC[getk('easyzfs-accent','zfc-accent')]||ACC.emerald;
  var v=dark?a.d:a.l,st=document.documentElement.style;
  st.setProperty('--accent',v[0]);st.setProperty('--accent-soft',v[1]);
  // --ok NO sigue al acento: es semántico (salud OK); vive solo en el CSS.
  if(getk('easyzfs-density','zfc-density')==='compact'){
    document.documentElement.dataset.density='compact';st.fontSize='13.5px';
  }
  if(ls.getItem('easyzfs-reduce-motion')==='1'){
    document.documentElement.classList.add('reduce-motion');
  }
  // Idioma guardado (auto = navigator) fijado antes del primer paint
  var L=getk('easyzfs-lang','zfc-lang');
  document.documentElement.lang=(L==='es'||L==='en')?L:
    (((navigator.language||'es').toLowerCase().indexOf('en')===0)?'en':'es');
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',dark?'#0e1210':'#f6f6f3');
}catch(e){}})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
