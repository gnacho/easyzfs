<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1210">
<meta name="description" content="EasyZFS — Gestión ZFS ligera para servidores caseros">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>EasyZFS - Gestión ZFS</title>
<script>
// Apariencia inicial antes del primer paint (evita parpadeo):
// tema (auto = prefers-color-scheme del SO), acento, densidad y
// reduce-motion guardados. Claves canónicas easyzfs-* con migración
// desde las legacy zfc-* (pre-rebrand zfsctl).
(function(){try{
  var ls=localStorage;
  function getk(nuevo,legacy){
    var v=ls.getItem(nuevo);
    if(v!==null)return v;
    var o=ls.getItem(legacy);
    if(o!==null){ls.setItem(nuevo,o);ls.removeItem(legacy);}
    return o;
  }
  // ESPEJO de ACCENTS en ui/theme.ts: si cambia una, cambia la otra.
  var ACC={
    cyan:{l:['#0e7c93','#dff0f4'],d:['#4cc3d9','#13292f']},
    steel:{l:['#3a6ea5','#e2ebf4'],d:['#7ba7d9','#1b2634']},
    emerald:{l:['#2f7d5f','#e3f0e9'],d:['#5cb893','#1d2f27']},
    amber:{l:['#a8741f','#f6ecd9'],d:['#d9a84e','#33291a']}
  };
  // ESPEJO de SKIN_BG en ui/theme.ts: si cambia una, cambia la otra.
  var SKINBG={'modern-dark':'#0d0e12','modern-light':'#f4f5f8','phosphor':'#050810','brutalist':'#f2ede1'};
  var st=document.documentElement.style, ms=document.querySelector('meta[name="theme-color"]');
  // Modelo: familia (easyzfs-theme) + modo (easyzfs-theme-mode). Migración
  // desde el modelo combinado anterior (auto|light|dark|modern-*|phosphor|brutalist).
  var fam=ls.getItem('easyzfs-theme'), mod=ls.getItem('easyzfs-theme-mode');
  if(fam===null){
    var legacy=ls.getItem('easyzfs-theme-mode')||ls.getItem('zfc-theme');
    if(legacy==='light'||legacy==='dark'||legacy==='auto'){fam='classic';mod=legacy==='auto'?'system':legacy;}
    else if(legacy==='modern-dark'){fam='modern';mod='dark';}
    else if(legacy==='modern-light'){fam='modern';mod='light';}
    else if(legacy==='phosphor'||legacy==='brutalist'){fam=legacy;mod='system';}
    else {fam='modern';mod='system';}
    ls.setItem('easyzfs-theme',fam);ls.setItem('easyzfs-theme-mode',mod);
  }
  var systemDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  var dark=(mod==='dark'||(mod==='system'&&systemDark));
  var dt;
  if(fam==='classic'){dt=dark?'dark':'';}
  else if(fam==='modern'){dt=dark?'modern-dark':'modern-light';}
  else {dt=fam;} // phosphor | brutalist
  document.documentElement.dataset.theme=dt;
  if(ms)ms.setAttribute('content',SKINBG[dt]||(dt==='dark'?'#0e1210':'#f6f6f3'));
  // Acento: en familias no-classic manda su CSS (salvo override); en clásico se aplica inline.
  if(fam!=='classic'){
    st.removeProperty('--accent');st.removeProperty('--accent-soft');
    var lum=fam==='modern'?(dark?'dark':'light'):(fam==='brutalist'?'light':'dark');
    var ov=ls.getItem('easyzfs-accent-'+fam);
    if(ov&&ACC[ov]){var ar=ACC[ov][lum];st.setProperty('--accent',ar[0]);st.setProperty('--accent-soft',ar[1]);}
  }else{
    var a=ACC[getk('easyzfs-accent','zfc-accent')]||ACC.emerald;
    var v=dark?a.d:a.l;
    st.setProperty('--accent',v[0]);st.setProperty('--accent-soft',v[1]);
  }
  if(getk('easyzfs-density','zfc-density')==='compact'){
    document.documentElement.dataset.density='compact';st.fontSize='13.5px';
  }
  if(ls.getItem('easyzfs-reduce-motion')==='1'){
    document.documentElement.classList.add('reduce-motion');
  }
  // Idioma guardado (auto = navigator) fijado antes del primer paint
  var L=getk('easyzfs-lang','zfc-lang');
  document.documentElement.lang=(L==='es'||L==='en')?L:
    (((navigator.language||'es').toLowerCase().indexOf('en')===0)?'en':'es');
}catch(e){}})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
