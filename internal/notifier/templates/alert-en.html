<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f2ef; margin: 0; padding: 24px; }
    .box { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; }
    .header { padding: 24px; color: #fff; background: {{.Color}}; }
    .header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .body { padding: 24px; color: #333; line-height: 1.6; }
    .footer { padding: 16px 24px; background: #fafaf8; color: #8a8f8a; font-size: 12px; border-top: 1px solid #eee; }
    .severity { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; text-transform: uppercase; background: rgba(255,255,255,0.25); }
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <div class="box">
    <div class="header">
      <span class="severity">{{.Severity}}</span>
      <h1>{{.Title}}</h1>
    </div>
    <div class="body">
      <p>{{.Summary}}</p>
      <p><strong>Pool:</strong> <span class="mono">{{.Target}}</span><br>
      <strong>Date:</strong> {{.Timestamp}}</p>
    </div>
    <div class="footer">
      Sent by EasyZFS · No telemetry, everything stays on your server.
    </div>
  </div>
</body>
</html>
