name: release

# Release estable por tag v*: compila el frontend (web/) y el binario Go
# estático (CGO_ENABLED=0, front embebido) para amd64 y arm64, consolida un
# checksums.txt ÚNICO y publica los assets.
#
# Naming GOARCH estándar (easyzfs_linux_amd64 / easyzfs_linux_arm64): es lo que
# espera creativeprojects/go-selfupdate ({cmd}_{goos}_{goarch}) para el
# auto-update in-app. install.sh resuelve también los nombres viejos
# (easyzfs-linux-{x86_64,aarch64} + checksums-<arch>.txt) para releases antiguas.
#
# La carrera de checksums.txt (v2.1.2) se resuelve consolidando en un job final:
# cada build sube su binario como artifact y 'consolidate' genera el
# checksums.txt único + publica todo (un solo publisher).

on:
  push:
    tags: ['v*']
  workflow_dispatch: # sin tag = compila y sube como artifact de prueba

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runs-on: ubuntu-latest
          - goarch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      # go:embed dist lo exige presente para compilar/tests; dist/ no se trackea
      # (regenerado en CI, ver .gitignore). Antes del go test para que no falle
      # con 'pattern dist: no matching files found'.
      - name: Prepara dist/ para go:embed
        run: rm -rf dist && cp -r web/dist dist

      - name: Tests Go
        run: go test ./...

      - name: Build binario estático (front embebido)
        env:
          REF: ${{ github.ref_name }}
        run: |
          VERSION="${REF#v}"
          [ "${{ github.ref_type }}" = "tag" ] || VERSION="0.0.0-SNAPSHOT-${GITHUB_SHA::7}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.build=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "easyzfs_linux_${{ matrix.goarch }}" .
          ls -la "easyzfs_linux_${{ matrix.goarch }}"
          file "easyzfs_linux_${{ matrix.goarch }}" || true

      - name: Sube binario como artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyzfs-bin-linux-${{ matrix.goarch }}
          path: easyzfs_linux_${{ matrix.goarch }}
          if-no-files-found: error

  consolidate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descarga binarios de ambos archs
        uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: easyzfs-bin-linux-*
          merge-multiple: true

      - name: Genera checksums.txt único y lista
        run: |
          # Entradas sin prefijo de directorio: la librería (ChecksumValidator)
          # compara el nombre del asset exacto (findChecksum: parts[1] == filename).
          (cd bin && sha256sum easyzfs_linux_*) > checksums.txt
          cat checksums.txt
          ls -la bin/

      - name: Publica en la release (solo tags)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/easyzfs_linux_*
            checksums.txt

      - name: Sube artifact de prueba (solo workflow_dispatch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: easyzfs-snapshot
          path: |
            bin/easyzfs_linux_*
            checksums.txt
          retention-days: 7
